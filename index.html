<head>

<body>
<div id="app" class="app"><div style="display:flex;min-height:70vh;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#8a94a6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><span style="width:26px;height:26px;border:3px solid #dbe2f5;border-top-color:#4a6cf7;border-radius:50%;animation:kgspin 0.9s linear infinite"></span><div style="font-size:14px">正在加载页面框架…</div></div></div>
<style>@keyframes kgspin{to{transform:rotate(360deg)}}</style>
<div id="toast" class="toast"></div>
<div id="wmload" class="wmload" style="display:none">
  <div class="wmcard">
    <div class="wm-melon"><span class="wm-seed w1"></span><span class="wm-seed w2"></span><span class="wm-seed w3"></span><span class="wm-seed w4"></span><span class="wm-seed w5"></span></div>
    <div class="wmtext" id="wmtext">正在加载…</div>
    <div class="wmbar"><i></i></div>
  </div>
</div>
<script src="app.js?v=20261021.1639"></script>
<script>
/* 装到手机桌面（PWA）：只在 https / localhost 下注册，失败不影响使用 */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  var hadCtrl = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js?v=20261021.1639').then(function (reg) {
      reg.update().catch(function () {});   /* 每次打开都主动查一次新版本 */
    }).catch(function () {});
  });
  /* 新版本已在下次打开时由「页面导航网络优先」自动生效，这里不强制刷新页面，
     避免打断正在进行的操作（如刚点开内容就被刷新导致“点不动”）。 */
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadCtrl) { hadCtrl = true; return; }
    var _t = document.getElementById('toast');
    if (_t) {
      _t.textContent = '✨ 新版本已就绪，下次打开自动生效';
      _t.classList.add('show');
      setTimeout(function () { _t.classList.remove('show'); }, 3000);
    }
  });
}
</script>
</body>
</html>
