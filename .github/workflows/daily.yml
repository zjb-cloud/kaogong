name: kaogong-daily-build

# 每天 06:15（北京时间，UTC 22:15）自动「生成当日刷题内容 + 构建 + 发布」，
# 全链路在 GitHub 服务器端完成，不依赖本地电脑；06:15 先于云端 06:27 预生成/06:30 推送。
on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily content (deterministic drills)
        working-directory: kaogong
        run: python gh_daily_gen.py

      - name: Run build_data.py
        working-directory: kaogong
        run: python build_data.py

      - name: Commit content + build outputs
        run: |
          git config user.name "kaogong-bot"
          git config user.email "kaogong-bot@users.noreply.github.com"
          git add kaogong/data kaogong/gh_daily_gen.py
          git commit -m "daily content+build $(date -u +%Y-%m-%d)" || echo "NO_CHANGE"
          git push origin main

      - name: Verify online data
        run: |
          curl -fsS -o /dev/null "https://raw.githubusercontent.com/zjb-cloud/kaogong/main/kaogong/data/all.js" && echo "ALL.JS OK"
          curl -fsS -o /dev/null "https://raw.githubusercontent.com/zjb-cloud/kaogong/main/data/shenlun.js" && echo "PAGES DATA OK"
